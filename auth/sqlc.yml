version: "2"
sql:
  - engine: "postgresql"
    schema: "./sql/migration"
    queries: "./sql/queries/"
    gen:
      go:
        package: "sqlc"
        out: "./internal/infrastructure/sqlc"
        sql_package: "pgx/v5"
        omit_unused_structs: true
        emit_prepared_queries: true
        emit_interface: true
        emit_db_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
        # emit_json_tags: true
        # emit_exact_table_names: true